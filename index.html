
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
  }
  .game {
    text-align: center;
    padding: 20px;
    width: min(100%, 500px);
  }
  h1 { color: #50fa7b; margin-bottom: 8px; }
  .score { font-size: 20px; margin: 15px; }
  canvas {
    width: 100%;
    max-width: 400px;
    background: #192b32;
    border: 3px solid #50fa7b;
    border-radius: 8px;
    display: block;
    margin: auto;
  }
  button {
    background: #50fa7b;
    color: #101820;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 10px 4px;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    justify-content: center;
    gap: 5px;
    margin-top: 12px;
  }
  .controls button { margin: 0; padding: 12px; }
  .empty { visibility: hidden; }
  #message { min-height: 24px; color: #ffd166; }
</style>
</head>
<body>
<div class="game">
  <h1>🐍 SNAKE GAME</h1>
  <div class="score">Điểm: <span id="score">0</span></div>
  <canvas id="board" width="400" height="400"></canvas>
  <p id="message">Dùng phím mũi tên hoặc WASD để di chuyển</p>
  <button onclick="startGame()">Chơi lại</button>
  <button onclick="togglePause()">Tạm dừng</button>

  <div class="controls">
    <span class="empty"></span>
    <button onclick="changeDir(0,-1)">⬆️</button>
    <span class="empty"></span>
    <button onclick="changeDir(-1,0)">⬅️</button>
    <button onclick="changeDir(0,1)">⬇️</button>
    <button onclick="changeDir(1,0)">➡️</button>
  </div>
</div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const message = document.getElementById("message");

const size = 20;
const cells = canvas.width / size;

let snake, food, dx, dy, score, timer;
let running = false;
let paused = false;
let ended = false;

function randomFood() {
  let p;
  do {
    p = {
      x: Math.floor(Math.random() * cells),
      y: Math.floor(Math.random() * cells)
    };
  } while (snake.some(s => s.x === p.x && s.y === p.y));
  return p;
}

function startGame() {
  clearInterval(timer);
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  dx = 1;
  dy = 0;
  score = 0;
  food = randomFood();
  running = true;
  paused = false;
  ended = false;
  scoreEl.textContent = score;
  message.textContent = "Cố gắng ăn thật nhiều táo!";
  draw();
  timer = setInterval(update, 120);
}

function changeDir(x, y) {
  if (!running || paused || ended) return;
  if (x === -dx && y === -dy) return;
  dx = x;
  dy = y;
}

function update() {
  if (!running || paused || ended) return;

  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  const eating = head.x === food.x && head.y === food.y;

  if (
    head.x < 0 || head.x >= cells ||
    head.y < 0 || head.y >= cells ||
    snake.slice(0, eating ? undefined : -1)
      .some(s => s.x === head.x && s.y === head.y)
  ) {
    ended = true;
    message.textContent = "💥 Game Over! Điểm của bạn: " + score;
    clearInterval(timer);
    draw();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    scoreEl.textContent = score;
    food = randomFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#192b32";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#243940";
  for (let i = 0; i <= cells; i++) {
    ctx.beginPath();
    ctx.moveTo(i * size, 0);
    ctx.lineTo(i * size, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * size);
    ctx.lineTo(canvas.width, i * size);
    ctx.stroke();
  }

  if (food) {
    ctx.fillStyle = "#ff5252";
    ctx.beginPath();
    ctx.arc(
      food.x * size + size / 2,
      food.y * size + size / 2,
      size / 2 - 2, 0, Math.PI * 2
    );
    ctx.fill();
  }

  if (snake) {
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#50fa7b" : "#25bd68";
      ctx.fillRect(s.x * size + 1, s.y * size + 1,
                   size - 2, size - 2);
    });
  }

  if (paused || ended) {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "center";
    ctx.fillText(paused ? "TẠM DỪNG" : "GAME OVER",
                 canvas.width / 2, canvas.height / 2);
  }
}

function togglePause() {
  if (!running || ended) return;
  paused = !paused;
  message.textContent = paused ? "Game đang tạm dừng" : "Tiếp tục nào!";
  draw();
}

document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp: [0,-1], w: [0,-1],
    ArrowDown: [0,1], s: [0,1],
    ArrowLeft: [-1,0], a: [-1,0],
    ArrowRight: [1,0], d: [1,0]
  };

  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (keys[key]) {
    e.preventDefault();
    changeDir(...keys[key]);
  }
  if (e.code === "Space") {
    e.preventDefault();
    togglePause();
  }
});

startGame();
</script>
</body>
</html>
